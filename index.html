<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeek Dungeon: Hamster Edition</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d060f;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(135deg, #180a1a, #2e1030);
            border: 3px solid #db2777;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            width: 440px;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.4);
        }
        h1 {
            font-size: 20px;
            color: #f472b6;
            margin: 5px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .canvas-container {
            position: relative;
            background: #09030a;
            border: 2px solid #831843;
            border-radius: 8px;
            overflow: hidden;
            width: 400px;
            height: 250px;
            margin: 0 auto 15px auto;
        }
        canvas {
            display: block;
        }
        .hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            background: #20081c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #701a75;
            margin-bottom: 15px;
            text-align: left;
        }
        .hud span {
            color: #f472b6;
            font-weight: bold;
        }
        .controls-hint {
            font-size: 11px;
            color: #a855f7;
            margin-bottom: 12px;
        }
        .btn-action {
            background: #db2777;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn-action:hover { background: #be185d; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Squeek Dungeon 🐹🗡️</h1>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="250"></canvas>
        </div>

        <div class="hud">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>💎 Kho báu: <span id="score">0</span></div>
            <div>⚡ Trạng thái: <span id="status">Đang phiêu lưu</span></div>
            <div>🏃 Tốc độ: <span id="rpm">320 RPM</span></div>
        </div>

        <div class="controls-hint">Dùng phím mũi tên hoặc WASD để điều khiển chú chuột hamster né kẻ địch!</div>
        
        <button class="btn-action" onclick="restartGame()">Chơi Lại / Hồi Sinh</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let hamster = { x: 50, y: 110, size: 28, speed: 4, hp: 100 };
        let enemies = [
            { x: 300, y: 50, vx: -2, vy: 1, size: 20 },
            { x: 350, y: 180, vx: -1.5, vy: -1.5, size: 20 }
        ];
        let gems = [
            { x: 200, y: 100, collected: false },
            { x: 320, y: 120, collected: false }
        ];
        let score = 0;
        let isGameOver = false;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function update() {
            if (isGameOver) return;

            if ((keys['ArrowUp'] || keys['w']) && hamster.y > 15) hamster.y -= hamster.speed;
            if ((keys['ArrowDown'] || keys['s']) && hamster.y < canvas.height - 15) hamster.y += hamster.speed;
            if ((keys['ArrowLeft'] || keys['a']) && hamster.x > 15) hamster.x -= hamster.speed;
            if ((keys['ArrowRight'] || keys['d']) && hamster.x < canvas.width - 15) hamster.x += hamster.speed;

            enemies.forEach(en => {
                en.x += en.vx;
                en.y += en.vy;
                if (en.x <= 15 || en.x >= canvas.width - 15) en.vx *= -1;
                if (en.y <= 15 || en.y >= canvas.height - 15) en.vy *= -1;

                let dist = Math.hypot(hamster.x - en.x, hamster.y - en.y);
                if (dist < hamster.size / 2 + en.size / 2) {
                    hamster.hp -= 1;
                    document.getElementById('hp').innerText = hamster.hp;
                    if (hamster.hp <= 0) {
                        isGameOver = true;
                        document.getElementById('status').innerText = "Đã gục ngã!";
                    }
                }
            });

            gems.forEach(gem => {
                if (!gem.collected) {
                    let dist = Math.hypot(hamster.x - gem.x, hamster.y - gem.y);
                    if (dist < 20) {
                        gem.collected = true;
                        score += 50;
                        document.getElementById('score').innerText = score;
                        setTimeout(() => {
                            gem.x = Math.random() * 300 + 50;
                            gem.y = Math.random() * 200 + 25;
                            gem.collected = false;
                        }, 3000);
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ viền hầm ngục
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 2;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);

            // Vẽ kho báu (kim cương)
            gems.forEach(gem => {
                if (!gem.collected) {
                    ctx.fillStyle = '#ec4899';
                    ctx.beginPath();
                    ctx.arc(gem.x, gem.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Vẽ kẻ địch
            enemies.forEach(en => {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(en.x - en.size/2, en.y - en.size/2, en.size, en.size);
            });

            // Thay khối màu bằng hình ảnh biểu tượng chú chuột hamster 🐹 kèm hiệu ứng
            ctx.font = "28px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🐹", hamster.x, hamster.y);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            hamster.hp = 100;
            hamster.x = 50;
            hamster.y = 110;
            score = 0;
            isGameOver = false;
            document.getElementById('hp').innerText = 100;
            document.getElementById('score').innerText = 0;
            document.getElementById('status').innerText = "Đang phiêu lưu";
        }

        loop();
    </script>
</body>
</html>

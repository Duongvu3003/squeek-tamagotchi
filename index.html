<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SqueekTamagotchi - Nuôi Hamster Ảo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .avatar {
            font-size: 80px;
            margin-bottom: 15px;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .running { background: #ff5722; color: #fff; }
        .sleeping { background: #3f51b5; color: #fff; }
        .stats {
            text-align: left;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

    <div class="card">
        <h2>SqueekTamagotchi 🐾</h2>
        <div id="hamster-avatar" class="avatar">🐹</div>
        <div id="status-badge" class="status-badge running">Đang kết nối...</div>
        
        <div class="stats">
            <p>⚡ Tốc độ vành: <span id="rpm">--</span> RPM</p>
            <p>🏃 Trạng thái thực tế: <span id="wheel-state">Đang tải...</span></p>
            <p>🍖 Điểm năng lượng: <span id="energy">100</span> EXP</p>
        </div>

        <button onclick="feedHamster()">Cho ăn hạt hướng dương 🌻</button>
    </div>

    <script>
        let energy = 100;

        async function fetchSqueekStatus() {
            try {
                // Gọi API công khai của Squeekchain để lấy trạng thái thực tế
                const response = await fetch('https://api.squeekchain.com/v1/status');
                const data = await response.json();
                
                // Giả lập đọc dữ liệu trả về từ API (Điều chỉnh theo schema thực tế của hệ thống)
                const isRunning = data.isRunning || true; 
                const currentRpm = data.rpm || 120;

                const badge = document.getElementById('status-badge');
                const avatar = document.getElementById('hamster-avatar');
                const wheelStateText = document.getElementById('wheel-state');
                document.getElementById('rpm').innerText = currentRpm;

                if (isRunning) {
                    badge.className = "status-badge running";
                    badge.innerText = "🔥 Đang chạy tăng tốc";
                    wheelStateText.innerText = "Đang chạy trên bánh xe";
                    avatar.innerText = "🐹💨";
                } else {
                    badge.className = "status-badge sleeping";
                    badge.innerText = "💤 Đang ngủ gật";
                    wheelStateText.innerText = "Đang nghỉ ngơi";
                    avatar.innerText = "🐹💤";
                }
            } catch (error) {
                // Fallback nếu gọi API trực tiếp bị chặn CORS ở môi trường test
                console.log("Sử dụng chế độ giả lập thời gian thực kết nối chuỗi.");
            }
        }

        function feedHamster() {
            energy += 10;
            document.getElementById('energy').innerText = energy;
            alert("Bạn đã cho Squeektoshi ăn một hạt hướng dương ảo! Năng lượng thú cưng tăng lên.");
        }

        // Cập nhật dữ liệu mỗi 15 giây đồng bộ với nhịp làm việc của hệ thống
        setInterval(fetchSqueekStatus, 15000);
        fetchSqueekStatus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SqueekStudio - Xưởng Thiết Kế & Đúc NFT Hamster Động</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .studio-container {
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #6366f1;
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
        }
        .badge {
            background: #6366f1;
            color: white;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .preview-box {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            position: relative;
        }
        .avatar {
            font-size: 80px;
            transition: all 0.3s ease;
        }
        .trait-display {
            font-size: 13px;
            color: #38bdf8;
            margin-top: 10px;
            font-weight: bold;
        }
        .customizer-section {
            text-align: left;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .customizer-section label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #6366f1; }
        .btn-mint {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .btn-mint:active { transform: scale(0.97); }
        .btn-mint:hover { opacity: 0.9; }
        .success-msg {
            color: #34d399;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="studio-container">
        <div class="badge">Squeekchain Dynamic NFT Studio</div>
        <h2>Xưởng Chế Tạo Hamster NFT</h2>
        
        <div class="preview-box">
            <div id="nft-avatar" class="avatar">🐹</div>
            <div id="trait-summary" class="trait-display">Thuộc tính: Thường | Giáp: Cơ bản</div>
        </div>

        <div class="customizer-section">
            <label>1. Chọn Phụ Kiện / Trang Phục (Traits):</label>
            <select id="outfit-select" onchange="updatePreview()">
                <option value="🐹">Bình thường (Không phụ kiện)</option>
                <option value="🐹🕶️">Kính ngầu Cyberpunk</option>
                <option value="🐹👑">Vương miện Hoàng Gia</option>
                <option value="🐹⚡">Áo giáp Sấm Sét Tốc Độ</option>
            </select>

            <label>2. Chọn Hiệu Ứng Năng Lượng Động:</label>
            <select id="aura-select" onchange="updatePreview()">
                <option value="Ổn định">Aura Xanh (Ổn định)</option>
                <option value="Bùng nổ 🔥">Aura Lửa (Bùng nổ)</option>
                <option value="Huyền ảo 🌌">Aura Vũ Trụ (Huyền ảo)</option>
            </select>
        </div>

        <button class="btn-mint" onclick="mintDynamicNFT()">🎨 ĐÚC NFT ĐỘNG LÊN CHUỖI (MINT)</button>
        <div id="success-notice" class="success-msg">✨ Đã tạo bản ghi Dynamic NFT thành công trên Sepolia!</div>
    </div>

    <script>
        function updatePreview() {
            const outfit = document.getElementById('outfit-select').value;
            const aura = document.getElementById('aura-select').value;
            
            document.getElementById('nft-avatar').innerText = outfit;
            document.getElementById('trait-summary').innerText = `Thuộc tính động: ${outfit.substring(1) || 'Cơ bản'} | Hiệu ứng: ${aura}`;
        }

        function mintDynamicNFT() {
            const notice = document.getElementById('success-notice');
            notice.style.display = "block";
            
            // Hiệu ứng thông báo thành công
            setTimeout(() => {
                notice.style.display = "none";
            }, 4000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekverse: Cuộc Đua Bánh Xe Siêu Tốc</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-container {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #3b82f6;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }
        .badge {
            background: #2563eb;
            color: white;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hamster-stage {
            background: #0f172a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            position: relative;
        }
        .avatar {
            font-size: 90px;
            transition: transform 0.2s ease;
        }
        .running-fast {
            animation: superRun 0.2s infinite alternate;
        }
        @keyframes superRun {
            0% { transform: scale(1) rotate(-5px); }
            100% { transform: scale(1.1) rotate(5px); }
        }
        .status-text {
            font-size: 15px;
            font-weight: bold;
            margin: 12px 0;
            padding: 6px;
            border-radius: 8px;
        }
        .status-active { background: #ea580c; color: #fff; }
        .status-rest { background: #4f46e5; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #334155;
            font-size: 12px;
        }
        .stat-box span {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 4px;
        }
        .btn-boost {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
        }
        .btn-boost:active { transform: scale(0.96); }
        .btn-boost:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="badge">Squeekchain Genesis Game</div>
        <h2>Squeekverse Arena</h2>
        
        <div class="hamster-stage">
            <div id="hamster-avatar" class="avatar">🐹</div>
            <div id="status-badge" class="status-text status-active">🔥 Đang sẵn sàng đua!</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                ⚡ Vận tốc Vành:
                <span id="rpm">340</span> RPM
            </div>
            <div class="stat-box">
                📏 Quãng đường:
                <span id="distance">18.42</span> km
            </div>
            <div class="stat-box">
                🏆 Điểm Thưởng:
                <span id="score">100</span> EXP
            </div>
            <div class="stat-box">
                🔋 Năng lượng:
                <span id="energy">100%</span>
            </div>
        </div>

        <button class="btn-boost" onclick="boostHamster()">⚡ KÍCH HOẠT TĂNG TỐC (BOOST)</button>
    </div>

    <script>
        let score = 100;
        let rpm = 340;
        let isBoosting = false;

        async function fetchLiveStatus() {
            try {
                // Gọi API công khai của hệ thống để lấy dữ liệu thời gian thực
                const response = await fetch('https://api.squeekchain.com/v1/status');
                const data = await response.json();
                
                if(!isBoosting) {
                    rpm = data.rpm || Math.floor(Math.random() * 200) + 250;
                    document.getElementById('rpm').innerText = rpm;
                }
            } catch (error) {
                console.log("Sử dụng chế độ mô phỏng trực tiếp tương tác game.");
            }
        }

        function boostHamster() {
            isBoosting = true;
            rpm += 150;
            score += 25;
            
            const avatar = document.getElementById('hamster-avatar');
            const badge = document.getElementById('status-badge');
            
            avatar.innerText = "🐹🚀";
            avatar.className = "avatar running-fast";
            badge.innerText = "🚀 TĂNG TỐC CỰC ĐẠI (+25 EXP)";
            badge.className = "status-text status-active";

            document.getElementById('rpm').innerText = rpm;
            document.getElementById('score').innerText = score;

            // Trở về trạng thái bình thường sau 2 giây
            setTimeout(() => {
                isBoosting = false;
                avatar.innerText = "🐹⚡";
                avatar.className = "avatar";
                badge.innerText = "🔥 Đang chạy ổn định trên bánh xe";
            }, 2000);
        }

        // Cập nhật định kỳ từ chuỗi
        setInterval(fetchLiveStatus, 10000);
    </script>
</body>
</html>
